<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さしすせそ Japanese voice player</title>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #FFF1F5; color: #5A2A45; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; max-width: 720px; }
  .ph { background: #fff; border: 1px solid #e4c9d5; border-radius: 12px; padding: 12px; cursor: pointer; text-align: center; font: inherit; color: inherit; }
  .ph.on { outline: 2px solid #5A2A45; }
  .k { font-size: 28px; font-weight: 700; margin: 0; }
  .w { font-size: 15px; margin: 4px 0 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 16px; }
  label { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  button.main { font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid #5A2A45; background: #fff; color: #5A2A45; cursor: pointer; }
</style>
</head>
<body>
<h1>さしすせそ Japanese voice player</h1>
<p style="font-size:13px">Best in Microsoft Edge with "Microsoft Nanami Online (Natural)". Use it as a pronunciation guide; it can't save audio files.</p>
<div id="grid"></div>
<div class="row">
  <button class="main" id="all">Play all</button>
  <label>Voice <select id="vs" style="max-width:240px"></select></label>
</div>
<div class="row">
  <label>Speed <input type="range" id="rt" min="0.6" max="1.4" step="0.1" value="1"><span id="rv">1.0</span></label>
  <label>Pitch <input type="range" id="pt" min="0.5" max="2" step="0.1" value="1.3"><span id="pv">1.3</span></label>
</div>
<p id="msg" style="font-size:13px"></p>
<script>
const P=[['さ','さすが！','さすが！'],['し','知らなかった！','しらなかった！'],['す','すごい！','すごーい！'],['せ','センスいいね！','センスいいね！'],['そ','そうなんだ！','そうなんだぁ！']];
const g=document.getElementById('grid'),vs=document.getElementById('vs'),msg=document.getElementById('msg'),rt=document.getElementById('rt'),pt=document.getElementById('pt');
P.forEach((p,i)=>{const d=document.createElement('button');d.className='ph';d.id='p'+i;d.innerHTML='<p class="k">'+p[0]+'</p><p class="w">'+p[1]+'</p>';d.onclick=()=>play([i]);g.appendChild(d)});
rt.oninput=()=>document.getElementById('rv').textContent=(+rt.value).toFixed(1);
pt.oninput=()=>document.getElementById('pv').textContent=(+pt.value).toFixed(1);
const S=window.speechSynthesis;let voices=[];
function load(){if(!S){msg.textContent="This browser doesn't support speech. Try Edge or Chrome.";return}
voices=S.getVoices().filter(v=>/^ja/i.test(v.lang));
if(!voices.length){msg.textContent="No Japanese voice found. Open this file in Edge.";return}
const pref=voices.findIndex(v=>/nanami|kyoko|haruka|google/i.test(v.name));
vs.innerHTML=voices.map((v,i)=>'<option value="'+i+'">'+v.name+'</option>').join('');
if(pref>=0)vs.value=pref;msg.textContent=voices.length+' Japanese voice(s) found.'}
load();if(S)S.onvoiceschanged=load;
function clear(){document.querySelectorAll('.ph.on').forEach(e=>e.classList.remove('on'))}
function play(list){if(!S||!voices.length){load();return}S.cancel();clear();
list.forEach((i,n)=>{const u=new SpeechSynthesisUtterance(P[i][2]);u.lang='ja-JP';u.voice=voices[+vs.value];u.rate=+rt.value;u.pitch=+pt.value;
u.onstart=()=>{clear();document.getElementById('p'+i).classList.add('on')};
u.onend=()=>{if(n===list.length-1)clear()};S.speak(u)})}
document.getElementById('all').onclick=()=>play([0,1,2,3,4]);
</script>
</body>
</html>
